name: Release
on:
  push:
    tags:
      - "v*"

# Default read-only. Elevated scopes are granted only to the job that needs them.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
      - name: Assert tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg. Run 'npm run bump-version $tag' before tagging." >&2
            exit 1
          fi
          echo "Tag and package.json agree on $pkg."
      - name: Assert the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_REF_NAME}" -q .status)"
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::$GITHUB_REF_NAME is not reachable from main (compare status: $status)." >&2
              exit 1
              ;;
          esac
          echo "$GITHUB_REF_NAME is reachable from main."
      - run: npm test
      - run: npm run test:evals
      - run: npm run test:semantic
      - run: npm run test:discovery
      - run: npm run test:stability
      - run: npm run test:stability-recorded
      - run: npm run test:provenance
      - run: npm run check-version
      - run: npm run check:release
      - name: Bundle release evidence
        run: node scripts/bundle-release-evidence.mjs --out-dir release-evidence
      - name: Verify staged release integrity and exact asset count
        run: node scripts/verify-release-provenance.mjs --integrity-only --dir release-evidence --expected-assets 18
      - name: Upload release evidence bundle
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-evidence
          path: release-evidence

  attest:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release evidence bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-evidence
          path: release-evidence
      - name: Generate SLSA build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release-evidence/*'

  publish:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download attested release evidence bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-evidence
          path: release-evidence
      - name: Probe Immutable Releases configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api_resp="$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" 2>&1 || true)"
          if echo "$api_resp" | grep -q '"enabled": *false'; then
            echo "::error::Immutable Releases are explicitly disabled for ${GITHUB_REPOSITORY}." >&2
            exit 1
          elif echo "$api_resp" | grep -q '"enabled": *true'; then
            echo "Immutable Releases are confirmed enabled via repository settings API."
          else
            echo "Repository settings endpoint repos/${GITHUB_REPOSITORY}/immutable-releases is not queryable with ambient GITHUB_TOKEN permissions (requires administration scope). Immutability enforcement will be verified authoritatively post-creation via isImmutable."
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -q .body)"
          released_at="$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')"
          {
            printf 'Released: %s (UTC+8 台北)\n\n' "$released_at"
            printf '%s\n' "$notes"
          } > release-notes.md
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            release-evidence/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease_flag

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
      - name: Clone the published tag and run its own gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/${GITHUB_REPOSITORY}.git" published
          cd published
          if [ -d node_modules ]; then
            echo "::error::The published tree ships node_modules; this plugin is meant to run with no installed dependencies." >&2
            exit 1
          fi
          reported="$(node -p "require('./package.json').version")"
          if [ "$reported" != "$tag" ]; then
            echo "::error::The published $GITHUB_REF_NAME reports package.json version $reported." >&2
            exit 1
          fi
          npm test
          npm run test:provenance
          npm run check:release
      - name: Download all published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published-assets
          gh release download "$GITHUB_REF_NAME" --dir published-assets --repo "$GITHUB_REPOSITORY"
      - name: Verify immutable release attestation and all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          immutable="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)"
          if [ "$immutable" != "true" ]; then
            echo "::error::Published release is not immutable." >&2
            exit 1
          fi
          gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          for asset in published-assets/*; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Verify content integrity and strict SLSA provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node published/scripts/verify-release-provenance.mjs \
            --dir published-assets \
            --expected-assets 18 \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$GITHUB_SHA"
          echo "A bare clone of $GITHUB_REF_NAME passes its release gates and strict provenance verification."
