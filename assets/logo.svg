<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <title>3lens - Triple Bubble Lenses</title>
  <defs>
    <!-- 鏡片 1 (主透鏡泡泡) -->
    <linearGradient id="b-lens-1" x1="42" y1="20" x2="86" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <!-- 鏡片 2 (次透鏡泡泡) -->
    <linearGradient id="b-lens-2" x1="68" y1="48" x2="104" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <!-- 鏡片 3 (微距透鏡泡泡) -->
    <linearGradient id="b-lens-3" x1="26" y1="58" x2="54" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- 3 個不同焦距的透鏡泡泡：天然融入 7sec 的吐泡生態 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 鏡片 1 (主鏡，右上，半徑 22) -->
    <circle cx="64" cy="42" r="22" stroke="url(#b-lens-1)" stroke-width="5" fill="#00F5FF" fill-opacity="0.12" />
    <circle cx="58" cy="36" r="3.5" fill="#FFFFFF" opacity="0.8" /> <!-- 泡泡透鏡高光 -->

    <!-- 鏡片 2 (中鏡，右下，半徑 18) -->
    <circle cx="86" cy="66" r="18" stroke="url(#b-lens-2)" stroke-width="4.5" fill="#38BDF8" fill-opacity="0.12" />
    <circle cx="81" cy="61" r="2.8" fill="#FFFFFF" opacity="0.8" />

    <!-- 鏡片 3 (小鏡，左下，半徑 14) -->
    <circle cx="40" cy="72" r="14" stroke="url(#b-lens-3)" stroke-width="4" fill="#7DD3FC" fill-opacity="0.12" />
    <circle cx="36" cy="68" r="2.2" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
